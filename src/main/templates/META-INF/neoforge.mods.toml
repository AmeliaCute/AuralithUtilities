modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}" #mandatory
logoFile="icon-utilities.png" #optional
authors="${mod_authors}" #optional
description='''${mod_description}'''

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

# Here's another dependency
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependences.${mod_id}]]
    modId="modern_industrialization"
    type="required"
    version="[${mi_version},)"
    ordering="BEFORE"
    side="BOTH"

[[dependences.${mod_id}]]
    modId="botanypotsmystical"
    type="required"
    version="[${botanypotmystical_version},)"
    ordering="BEFORE"
    side="BOTH"

[[dependences.${mod_id}]]
    modId="mysticalaggraditions"
    type="required"
    version="[${mysticalagradditions_version},)"
    ordering="BEFORE"
    side="BOTH"
